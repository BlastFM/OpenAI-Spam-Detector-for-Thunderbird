<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <rect width="900" height="260" rx="18" fill="#eef3f5"/>
  <rect x="24" y="24" width="852" height="212" rx="18" fill="#123b56"/>
  <text x="54" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Dynamic options status</text>
  <text x="54" y="99" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#c7e9e3">The header communicates settings and action feedback in one place.</text>
  <rect x="54" y="138" width="174" height="38" rx="19" fill="#fff" fill-opacity=".13" stroke="#f8d58a"/><circle cx="76" cy="157" r="6" fill="#f5c04f"/><text x="91" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">Unsaved changes</text>
  <rect x="246" y="138" width="106" height="38" rx="19" fill="#fff" fill-opacity=".13" stroke="#b7d4ff"/><circle cx="268" cy="157" r="6" fill="#b7d4ff"/><text x="283" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">Saving...</text>
  <rect x="370" y="138" width="83" height="38" rx="19" fill="#fff" fill-opacity=".13" stroke="#8cf0b8"/><circle cx="392" cy="157" r="6" fill="#8cf0b8"/><text x="407" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">Saved</text>
  <text x="54" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#c7e9e3">Transient feedback resets after five seconds; unsaved edits remain visible.</text>
</svg>
