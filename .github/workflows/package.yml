name: Package Thunderbird Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Extension Package (.xpi / .zip)
        run: |
          mkdir -p dist
          zip -r dist/openai-spam-detector.xpi manifest.json background.js icons/ options/ popup/ -x "*.DS_Store"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openai-spam-detector-xpi
          path: dist/openai-spam-detector.xpi

      - name: Create Release (Tag Pushes Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openai-spam-detector.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
