name: Package Thunderbird Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Grants GITHUB_TOKEN permissions to create releases and attach .xpi assets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix File Permissions
        run: |
          chmod -R 644 ./*
          chmod -R 755 ./options ./icons 2>/dev/null || true

      - name: Build XPI Package
        run: |
          zip -r openai-spam-detector.xpi manifest.json options/ background.js icons/ _locales/ README.md LICENSE

      - name: Upload Build Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: openai-spam-detector-xpi
          path: openai-spam-detector.xpi

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: openai-spam-detector.xpi
          generate_release_notes: true
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}