name: Package Thunderbird Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build XPI Package
        run: |
          # Package required files explicitly without breaking on missing directories
          zip -r openai-spam-detector.xpi manifest.json options background.js icons _locales README.md LICENSE -x "*.git*"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openai-spam-detector-xpi
          path: openai-spam-detector.xpi

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: openai-spam-detector.xpi
          generate_release_notes: true
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}